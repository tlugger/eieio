[package]
name = "eio-expr"
description = "The eieio expression language: lexer, parser, analysis, interpreter (EXPR-SPEC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eio-signal.workspace = true

# Tests only. Canonical rendering claims floats round-trip (EXPR-SPEC §7.6); a
# property over generated floats is the only way to believe it, since the failures
# live in magnitudes nobody writes by hand.
[dev-dependencies]
proptest.workspace = true
# Tests only. The expr-tests/ corpus is JSON data files (EXPR §11) and the runner in
# tests/vectors.rs is what executes them; the interpreter itself reads no JSON.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package]
name = "eio-leaf"
description = "The leaf-class node runtime, built for the host (eieio-x7g.2 first milestone: does host-core compose into a second runtime at all)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A lib target beside the binary, for the same reason `eio-daemon`'s exists (root
# `Cargo.toml`'s comment on it): `tests/` is a second crate that links a library, not a
# binary, and both the end-to-end test and the conformance-harness probe need the engine
# binding, the `eio:core` functions and the state store this binary itself builds against.
[lib]
name = "eio_leaf"
path = "src/lib.rs"

[[bin]]
name = "eio-leaf"
path = "src/main.rs"
# The demo binary is the host bring-up, not a firmware image: it prints to stdout, shells out
# to `cargo` to build the golden blocks, and drives its graph on wasm3. `required-features` is
# what keeps `cargo build --no-default-features --target thumbv7em-none-eabihf` from trying to
# link a `no_std` binary with no `#[panic_handler]` and no entry point — cargo skips a target
# whose required features are off, so the bare-metal gate builds the library and nothing else.
# `wasm3` rather than `std`, because the demo names one engine: `run_demo` hands `spawn`
# `wasm3::instantiate`, so what the binary needs is that engine's feature, not the platform's.
required-features = ["wasm3"]

# ── the no_std boundary (LEAF §2) and the engine selector (LEAF §3) ──────────
#
# `default` turns on everything the host bring-up needs, so every existing call site —
# `main.rs`, `tests/`, `just ci` — keeps working unchanged, and `--no-default-features` is what
# a firmware build uses. What `std` gates, and why each piece cannot cross, is enumerated in
# `src/lib.rs`'s crate docs; this is only the Cargo half of that statement.
#
# `wasm3` and `wamr` are the two engines LEAF §3 names, and they are separate features because
# LEAF §3.2 makes the engine a per-image choice: a firmware build enables exactly one, and each
# is a `#[cfg]`-gated module implementing `eio_host_core::Engine` rather than something `spawn`
# knows about (`spawn` takes the `instantiate` function). The *host* build enables both, and
# that is a measurement rig's shape rather than a leaf's: LEAF §9's suites have to run against
# each binding, and "divergence between hosts is a conformance bug by definition" (ABI §13) is
# only checkable inside the leaf tier if both are linked into one test run.
#
# Both imply `std`: `wasm3x` builds the wasm3 C sources and its own wrapper against `std`, and
# `wamrx-sys` builds WAMR's C core and needs `CString`/`Mutex`/`Once` to drive it. Neither
# crosses the `no_std` boundary today, which is why an engine binding for a bare-metal target
# is settled by LEAF §11's MCU cross-compile and not here.
[features]
default = ["wasm3", "wamr"]
std = []
wasm3 = ["std", "dep:wasm3x"]
wamr = ["std", "dep:eio-wamr-host"]

[dependencies]
# The engine-agnostic host half this milestone exists to prove composes: the lifecycle
# driver, the property protocol, the router core, the `StateStore`/`Timers` traits (LEAF
# §2). Linked unchanged — nothing in this crate patches it.
eio-host-core.workspace = true

# The manifest schema, parser and the ABI §4.3 load-time cross-check (`eio_manifest::validate`).
# A leaf MUST run it at build time (LEAF §3.1); this bring-up runs it at process start, which
# is the host-build stand-in for "at firmware build time".
eio-manifest.workspace = true

# Batches and values, for building the one signal this bring-up delivers and reading what
# comes back out the other side.
eio-signal.workspace = true

# Not for evaluating properties — `eio-host-core` does that — but for `EvalLimits` itself,
# which `PropContext::compile_with_limits` and `ExprBudgets::new` both take by name and which
# `eio-host-core` does not re-export (the same reason `crates/daemon` names this dependency
# directly rather than reaching for it through the host-agnostic crate).
eio-expr.workspace = true

# wasm3 (LEAF §3's second measured interpreter): no AOT path, interpreted throughout, and
# already the leaf-class interpreter `crates/conformance/tests/wasm3.rs` measures against
# ABI §4.3's accepted set. It was the first binding written here because its API needs no
# native-registration workaround — `wasm3x` hands a host closure the calling `Caller`, which
# every ABI §7 function touching guest memory needs.
#
# Optional, and gated behind `std`: `wasm3x` builds the wasm3 C sources and its own wrapper
# against `std`, so it cannot cross the `no_std` boundary. LEAF §2 lists an engine binding as
# one of the things a leaf *adds* on top of the ★ crates, so a firmware build supplies its
# own — which is why `spawn` is generic over `E: eio_host_core::Engine` and this binding is
# one implementation of that trait rather than the one `spawn` names.
wasm3x = { version = "0.1.0", optional = true }

# WAMR (LEAF §3's leaf engine), in interpreter mode — the mode §3 says a bring-up or a
# debugging build uses. The AOT mode §6.1 describes needs `wamrc`, which is blocked on six
# recorded toolchain failures (eieio-7d8.21) and is a bead of its own; the interpreter needs
# none of it, because WAMR's core is C and this machine's C compiler works.
#
# **Not `wamrx-sys` directly, and that is the point** (eieio-7d8.34): `crates/wamr-host` is
# the binding, and `crates/conformance/tests/wamr.rs` dev-depends on the same crate rather
# than keeping the second copy of it this file's `src/wamr.rs` used to be. That crate depends
# on neither of them, so no cycle exists and the reference harness is not measuring the leaf's
# own code. What stays here is the leaf's own budget line — `wamr::EXEC_STACK_SIZE`, LEAF
# §4.2's 8 KiB reserve — which is exactly what a shared constant would have got wrong.
#
# Optional, and gated behind `std`, for the same reason `wasm3x` is: it builds WAMR's C core
# and drives it with `CString`/`Mutex`/`Once`, so it cannot cross the `no_std` boundary.
eio-wamr-host = { workspace = true, optional = true }

[dev-dependencies]
# Whether the ABI §13 conformance harness can drive this binding at all is one of this
# milestone's own questions (LEAF §9). Dev-only: a leaf image has no business linking
# wasmtime, and this crate's binary never does — only `tests/conformance.rs` reaches for it,
# the same way `crates/conformance/tests/wasm3.rs` reaches for `wasm3x` as a dev-dependency
# of a crate that otherwise has nothing to do with it.
eio-conformance.workspace = true

# Tests only. `expr-tests/`'s three corpora (LEAF §9's suite 2) are JSON data files and
# `tests/expr_vectors.rs`, `tests/properties_vectors.rs` and `tests/cbor_vectors.rs` are what
# execute them — the same reason `crates/expr`, `crates/host-core` and `crates/signal` carry
# this pair as dev-dependencies for their own copies of this corpus.
serde.workspace = true
serde_json.workspace = true

# LEAF §9's suite 3: `tests/instruction_table.rs` reaches
# `crates/conformance/tests/support/wasm3_instructions.rs` with `#[path]`, and that shared
# module assembles its WAT fixtures with `wat::parse_str` — the same crate
# `crates/conformance`'s own `wat` dependency uses for the identical purpose. Dev-only, the
# same reason `eio-conformance` is: no leaf image has any business assembling WAT at runtime.
wat.workspace = true

[lints]
workspace = true

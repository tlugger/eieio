# Deliberately NOT a workspace member: it builds for wasm32-unknown-unknown as a cdylib,
# which is a different target and crate type than anything in the workspace, and
# `tests/rust_block.rs` builds it on demand rather than `just build` building it always.
[workspace]

[package]
name = "rust-transform"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
eio-sdk = { path = "../../../../block-sdk" }

# SDK §4: panics abort — a guest has no unwinder, and a panic must become a trap.
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true

[package]
name = "eio-conformance"
description = "The reference conformance harness for the eieio block ABI: scenario runner, fault injection, and a minimal wasmtime host (ABI-SPEC §13.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The half of a host that is not about an engine. Driving a guest through
# `eio_host_core` is the point of the harness rather than an implementation choice:
# a harness with a lifecycle driver of its own would be a third host to keep in
# agreement with the other two (ABI §13, DAEMON §1).
eio-host-core.workspace = true

# ABI §4's load-time validation, and the manifest a scenario derives its descriptor
# from — port indices and `prop_id`s are the manifest's order (ABI §5.2, §11).
eio-manifest.workspace = true

# Batches, decoded from the canonical CBOR a scenario carries as hex (ABI §6.3.1).
eio-signal.workspace = true

# The reference engine. Same feature set as the daemon's, and for the same reason:
# threads, the component model and GC are compiled out, so no `Config` call can
# admit them (ABI §1.1, DAEMON §5.1).
wasmtime.workspace = true

# `wasmtime::Error` is `anyhow::Error`, so the reference host's own failures may as well be
# too rather than converting at every boundary — the same reasoning as the daemon's.
anyhow.workspace = true

# Scenarios are data (ABI §13.1). Full `std` serde_json here — this crate is a host,
# not a ★ crate.
serde = { workspace = true, default-features = false, features = ["std"] }
serde_json = { workspace = true, default-features = false, features = ["std"] }

# A scenario names its module as a file, and fixtures are checked in as `.wat` so a
# reviewer can read what each one exercises. Not a dev-dependency here: reading the
# module is what the suite loader does, and its callers are tests in other crates.
wat.workspace = true

[dev-dependencies]
# The third host (ABI §13): wasm3, the leaf-class interpreter SCOPE §3.2 names. A
# *dev*-dependency and not a library one, deliberately — it builds a C interpreter through
# cmake, and the daemon dev-depends on this crate, so a library dependency would put that
# build in the daemon's test path for nothing. The `Host` impl therefore lives in
# `tests/wasm3.rs`, which is also where a second engine belongs: this crate ships the
# *reference* host, and wasm3 is the independent engine the reference is checked against.
wasm3x = "0.1.0"

# The fourth host (ABI §13, eieio-x7g.3): WAMR's fast interpreter, the AOT engine SCOPE §3.2
# and SDK §5 name for ESP32-class leaf targets — AOT itself is eieio-7d8.21, parked on a
# `wamrc` this machine cannot build, but the interpreter needs none of that. A *dev*-dependency
# for the identical reason `wasm3x` is one: it builds a C runtime through cmake, and the
# daemon dev-depends on this crate, so a library dependency would put that build in the
# daemon's test path for nothing. The `Host` impl lives in `tests/wamr.rs`.
#
# `wamrx` (the safe wrapper `wamrx-sys` backs) is deliberately *not* a dependency here, and
# that absence is worth explaining rather than leaving silent. Its `Linker::define_func`
# closure is `Fn(&[Val], &mut [Val])` with no access to the calling instance at all — WAMR's
# raw native calling convention hands the C trampoline an `exec_env`, but `wamrx` never
# forwards it to the host closure — and every ABI §7 function that touches guest memory
# (`log`, `emit`, `prop`, `state_*`, …) needs exactly that access. `wamrx::Module` and
# `wamrx::Instance` compound it: their raw handles are `pub(crate)`, so there is no partial mix
# of `wamrx` for module load/instantiation and raw FFI for native registration either. So
# `tests/wamr.rs` registers its natives, loads, instantiates, and reads/writes guest memory
# directly against `wamrx-sys`, the same layer `wamrx`'s own `Linker`/`Instance` are built on
# one level up — including runtime init, since even that turned out not to be reusable:
# `wamrx::Engine` tears the runtime down (and wipes its native registry with it) when its last
# clone drops, which is fatal to a registration this file only ever wants to perform once
# (`tests/wamr.rs`'s `ensure_runtime` doc has the measurement). None of this is a complaint
# about `wamrx` — a safe wrapper without instance-scoped host state and with owned, hidden
# handles is a perfectly good design for a guest that only calls exports — it just is not a
# shape this ABI's host functions fit.
wamrx-sys = "0.3.0"

# The harness must consume any conforming `.wasm`, so there is deliberately no `eio-sdk`
# here — that would be the coupling ABI §13's language-agnosticism rules out (SDK §7).
# `tests/reference.rs` asserts its absence.

[lints]
workspace = true

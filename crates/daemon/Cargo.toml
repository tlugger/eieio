[package]
name = "eio-daemon"
description = "The daemon-class node runtime: tokio, wasmtime, and the host side of the eieio block ABI (DAEMON-SPEC)"
# Its own, not the workspace's. SCOPE §7.2 makes release pipelines per component
# and tag-triggered, and `daemon-v0.1.0` releases the daemon alone — so the daemon
# has to be able to reach 0.2.0 without republishing `eio-sdk` at a version nothing
# in it changed. The ★ crates and the SDK keep `version.workspace`, because
# crates.io publishes those together (§7.2).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A binary and nothing else. DAEMON-SPEC §1's table gives `eio-daemon` no import
# path, and there is nothing here another crate should link against: the reusable
# half of the host is `eio-host-core`, on purpose. Tests live in `#[cfg(test)]`
# modules beside the code they cover.
[[bin]]
name = "eio-daemon"
path = "src/main.rs"

[dependencies]
# The engine-agnostic host. Every ABI rule the daemon obeys is obeyed *here*, so the
# leaf runtime obeys the same one (DAEMON §1). What this crate adds is wasmtime.
eio-host-core.workspace = true

# Load-time validation is exactly ABI §4 (DAEMON §4), and this is the one
# implementation of it.
eio-manifest.workspace = true

# The service file, as a schema and two validation stages (SERVICE-SPEC). The daemon
# is one of three callers — the CLI and the Designer's backend are the others — which
# is why it is a crate and not a module here (DAEMON §1).
eio-service.workspace = true

# Batches on the way in and on the way out (ABI §6.3).
eio-signal.workspace = true

# Not for evaluating properties — `eio-host-core` does that — but for `render`,
# EXPR §7.6's canonical rendering, which is how an emitted batch reaches a terminal.
# A second renderer in the daemon would be a second definition of what a value looks
# like, and the conformance vectors pin only this one.
eio-expr.workspace = true

# The block manager (DAEMON §4): the registry client is four requests and a signature
# check, written here rather than vendored. The root manifest carries the measurement.
ureq.workspace = true
sha2.workspace = true
p256.workspace = true
base64.workspace = true

# The management API (DAEMON §9). The OpenAPI document is derived from the handlers,
# because SCOPE §4 makes it an agent's tool surface and not a by-product.
axum.workspace = true
utoipa.workspace = true

wasmtime.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
getrandom.workspace = true
anyhow.workspace = true

# The `dev run-block` batch flag is JSON (DAEMON §12). Full `std` serde_json here,
# unlike the `alloc`-only build the ★ crates share.
serde_json = { workspace = true, default-features = false, features = ["std"] }

# `node.toml` (DAEMON §2.1). The same `parse`-and-`serde` build `eio-service` uses:
# the daemon writes a node's configuration file exactly once, from a commented
# template, so there is nothing here for `display` to do.
toml.workspace = true
serde = { workspace = true, default-features = false, features = ["std", "derive"] }

[dev-dependencies]
# ABI §13's "both the daemon and the leaf runtime MUST pass the harness". A dev-dependency
# and not a lib target on this crate: DAEMON §1's table gives `eio-daemon` no import path,
# so the harness reaches the daemon's wasmtime binding from inside its own test module
# (`src/conformance.rs`) rather than the daemon publishing one.
eio-conformance.workspace = true

# Test blocks are checked in as `.wat` so a reviewer can read what each one exercises,
# and assembled at test time. Same rationale, and same pin, as `manifest`'s fixtures.
wat.workspace = true

[lints]
workspace = true

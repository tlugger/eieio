[package]
name = "eio-daemon"
description = "The daemon-class node runtime: tokio, wasmtime, and the host side of the eieio block ABI (DAEMON-SPEC)"
# Its own, not the workspace's. SCOPE §7.2 makes release pipelines per component
# and tag-triggered, and `daemon-v0.1.0` releases the daemon alone — so the daemon
# has to be able to reach 0.2.0 without republishing `eio-sdk` at a version nothing
# in it changed. The ★ crates and the SDK keep `version.workspace`, because
# crates.io publishes those together (§7.2).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The binary is what DAEMON-SPEC §1's table means by `eio-daemon`: nothing another crate
# depends on, because the reusable half of the host is `eio-host-core`, on purpose. The lib
# target below (`src/lib.rs`, implicit — Cargo finds it by convention, the way `eio-cli`'s
# is) exists for exactly one dependent: `crates/cli/tests`, which needs `Document::openapi()`
# in-process to check DAEMON §9's live surface without spawning this binary (eieio-yck.3). Tests
# on the daemon's own internals still live in `#[cfg(test)]` modules beside the code they cover.
[[bin]]
name = "eio-daemon"
path = "src/main.rs"

[dependencies]
# The engine-agnostic host. Every ABI rule the daemon obeys is obeyed *here*, so the
# leaf runtime obeys the same one (DAEMON §1). What this crate adds is wasmtime.
eio-host-core.workspace = true

# Load-time validation is exactly ABI §4 (DAEMON §4), and this is the one
# implementation of it.
eio-manifest.workspace = true

# The service file, as a schema and two validation stages (SERVICE-SPEC). The daemon
# is one of three callers — the CLI and the Designer's backend are the others — which
# is why it is a crate and not a module here (DAEMON §1).
eio-service.workspace = true

# Batches on the way in and on the way out (ABI §6.3).
eio-signal.workspace = true

# Not for evaluating properties — `eio-host-core` does that — but for `render`,
# EXPR §7.6's canonical rendering, which is how an emitted batch reaches a terminal.
# A second renderer in the daemon would be a second definition of what a value looks
# like, and the conformance vectors pin only this one.
eio-expr.workspace = true

# The block manager (DAEMON §4): the registry client is four requests and a signature
# check, written here rather than vendored. The root manifest carries the measurement.
ureq.workspace = true
sha2.workspace = true
p256.workspace = true
base64.workspace = true

# The management API (DAEMON §9). The OpenAPI document is derived from the handlers,
# because SCOPE §4 makes it an agent's tool surface and not a by-product.
axum.workspace = true
utoipa.workspace = true
async-stream.workspace = true
futures-core.workspace = true

# The diff a refused `PUT` carries (DAEMON §9.3), so a conflict tells an operator what moved
# rather than handing back two files and a hash.
similar.workspace = true

# What backs `eio:state` (DAEMON §10). One file under the node's `state/`, and the
# only durable thing on a node that is not a file an operator wrote.
redb.workspace = true

wasmtime.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
getrandom.workspace = true
anyhow.workspace = true

# The `dev run-block` batch flag is JSON (DAEMON §12). Full `std` serde_json here,
# unlike the `alloc`-only build the ★ crates share.
serde_json = { workspace = true, default-features = false, features = ["std"] }

# `node.toml` (DAEMON §2.1). The same `parse`-and-`serde` build `eio-service` uses:
# the daemon writes a node's configuration file exactly once, from a commented
# template, so there is nothing here for `display` to do.
toml.workspace = true
serde = { workspace = true, default-features = false, features = ["std", "derive"] }

# The pub/sub bridge's transport (DAEMON §7, SCOPE §3.9), entirely inside `src/bridge.rs` —
# `the_bridge_boundary_holds` fails the build if this name reaches any other module. Version
# and dev-dependency pinned here rather than in the workspace table (unlike every other
# dependency above): this crate's `Cargo.toml` is this change's whole footprint, deliberately,
# so it does not touch a manifest shared with unrelated work in flight. `default-features =
# false` drops `use-rustls`, rumqttc's only default feature — SCOPE §3.11 (transport security
# on the bus) is OPEN, so this bridge speaks plain TCP and invents no TLS posture; pulling in
# rustls for a feature nothing here turns on would be a heavier tree for no capability.
rumqttc = { version = "0.25", default-features = false }

[dev-dependencies]
# The bridge's transport is real MQTT and its tests must prove that without a broker anyone
# has to start by hand (eieio-2vm.2's constraint, restated in eieio-2vm.4): `rumqttd` is the
# same wire protocol `rumqttc` speaks, embeddable as a library rather than a subprocess, so a
# test spins one up on a loopback port and tears it down with the process. `default-features
# = false` drops `use-rustls` and `websocket`, matching `rumqttc` above — the fixture broker
# needs to accept exactly the plain-TCP connections this bridge makes, nothing more.
rumqttd = { version = "0.20", default-features = false }
# ABI §13's "both the daemon and the leaf runtime MUST pass the harness". A dev-dependency,
# and `src/conformance.rs` stays a private `#[cfg(test)]` module of the lib target above
# rather than a public one: the harness reaches the daemon's wasmtime binding from inside its
# own test module, not through a path this crate publishes.
eio-conformance.workspace = true

# Test blocks are checked in as `.wat` so a reviewer can read what each one exercises,
# and assembled at test time. Same rationale, and same pin, as `manifest`'s fixtures.
wat.workspace = true

# One test corrupts a cached module inside a well-framed function body (ABI §4.3), and
# locating that byte through the same reader the loader uses is what proves the corruption
# is not a truncation — which was always refused and would test nothing new.
wasmparser.workspace = true

# eieio-7d8.33's publish/pull round trip: `registry::roundtrip` calls `publish::run` — the
# real `cargo eio publish` code — and pulls what it pushed back with this crate's own,
# private `registry::Registry::pull`, so the two halves of DAEMON §4.1/§4.2 are checked
# against each other rather than against a shared reading of the spec. `path`, not
# `workspace = true`: nothing else in the workspace depends on `cargo-eio` as a library, so
# there is no shared table entry to reuse. `features = ["testing"]` reaches its
# `fake_registry` — the one OCI registry both halves push to and pull from (`cargo-eio`'s own
# `src/lib.rs` doc explains why that module, and not a promoted `registry::fake::Fake`, is
# what this test shares). No cycle: `cargo-eio` depends on `eio-manifest` and
# `eio-conformance`, both already dependencies of this crate, and neither depends back on
# `eio-daemon`.
cargo-eio = { path = "../cargo-eio", features = ["testing"] }

[lints]
workspace = true

[package]
name = "eio-cli"
description = "The eieio command line: author service files, and drive a node (SCOPE §5.1)"
# Its own, like the daemon's and for the same reason: SCOPE §7.2 makes release
# pipelines per component and tag-triggered, so the CLI has to be able to reach
# 0.2.0 without republishing crates nothing in them changed.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The package is `eio-cli` by the workspace's directory rule; the binary is `eio`,
# which is what SCOPE §5.1 records and what a person types. DAEMON §1 says why that
# is not a third naming convention: the prefix rule is about identifiers, not argv.
[[bin]]
name = "eio"
path = "src/main.rs"

[dependencies]
# The service file: schema, both validation stages, and — since SERVICE §9 — the
# preserving editor every mutating command here goes through. This crate contributes
# argument parsing and output; it contributes no opinion about what a service file is.
eio-service.workspace = true

# Stage 2's input (SERVICE §7). `--manifest REF=PATH` reads what `cargo eio build`
# wrote, through the same parser a node validates with.
eio-manifest.workspace = true

# `add-block` mints an id, and `eio_service::id::generate` takes its randomness from
# the caller precisely so that a service file's contents do not depend on which binary
# was linked. This is that caller's source, and it is the daemon's too.
getrandom.workspace = true

# Derive rather than the builder, so the flags and the structs cannot drift.
clap.workspace = true

anyhow.workspace = true

# The management API's transport (DAEMON §9). The same blocking client the daemon's own
# block manager uses (DAEMON §4.1) — a CLI invocation is one process making one call and
# exiting, which is exactly the shape a blocking client is for, and pulling in an async
# runtime here would buy nothing this binary awaits concurrently.
ureq.workspace = true

# `~/.config/eieio/nodes.toml` (eieio-yck.1's DESIGN) and every JSON body/response the
# management API speaks (DAEMON §9). `std` because this binary is std throughout — it is
# not a ★ crate (CLAUDE.md's repository layout) — unlike the `alloc`-only build the ★
# crates share.
serde = { workspace = true, default-features = false, features = ["std", "derive"] }
serde_json = { workspace = true, default-features = false, features = ["std"] }

# `nodes.toml`'s reader *and* writer. The workspace default (`parse`, `serde`) is what
# `eio-service`'s stage-1 validation needs and is deliberately reader-only (SERVICE §9
# keeps writing to `toml_edit`'s preserving editor); `nodes.toml` is a machine-managed
# file with no human trivia to preserve, so a value-tree round trip through `display`
# is the whole of what it needs, added here rather than in the workspace table because
# no other crate wants a TOML writer that forgets comments.
toml = { workspace = true, features = ["display", "std"] }

[dev-dependencies]
# `tests/openapi_surface.rs` (eieio-yck.3) calls `Document::openapi()` in-process to check
# DAEMON-SPEC §9's *live* surface against `client.rs`'s `ENDPOINTS`, closing the gap
# `tests/api_surface.rs` (eieio-yck.1) could not: a route added to the daemon's router without
# touching the CLI. A dev-dependency, not a `[dependencies]` one — this binary never talks to
# `eio-daemon` in-process at runtime, only a test does — and `eio-daemon` has no dependency
# back on `eio-cli` in any form, so this creates no cycle.
eio-daemon.workspace = true

# `Document::openapi()` returns `utoipa::openapi::OpenApi`; reading its `paths` needs the same
# crate's types (`PathItem`, and the `OpenApi` trait `Document::openapi` comes from). Dev-only,
# for the same reason `eio-daemon` above is: no command in this binary builds an OpenAPI
# document, only this test reads one.
utoipa.workspace = true

[lints]
workspace = true

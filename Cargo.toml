[workspace]
# Resolver 3 is the edition-2024 default and is MSRV-aware; a virtual manifest
# must state it explicitly.
resolver = "3"
# Crates are added by their own epics. This list grows; it is never a glob,
# because a glob that matches nothing is a hard error in cargo.
members = [
    "crates/abi",
    "crates/block-sdk",
    "crates/block-sdk-macros",
    "crates/cargo-eio",
    "crates/conformance",
    "crates/test-host",
    "crates/daemon",
    "crates/expr",
    "crates/host-core",
    "crates/manifest",
    "crates/service",
    "crates/signal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tlugger/eieio"

# Pinned once here, used by every crate that touches the wire format. Two host
# implementations have to agree byte for byte (ABI-SPEC §6.3), so the codec
# version is not a per-crate choice.
#
# `default-features = false` drops `std`; `alloc` is what the ★ crates are
# allowed (CLAUDE.md). The `half` feature stays OFF deliberately: eieio's
# canonical form admits binary64 floats only, so a decoder that could read
# binary16 would accept bytes our encoder can never produce (ABI §6.3).
[workspace.dependencies]
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }

# The manifest is JSON (ABI-SPEC §11) and `manifest` is a ★ crate, so its parser
# has to run with `alloc` and no `std` — including on a target without atomics.
# These two do (DAEMON-SPEC §1 records the choice and the alternatives). Pinned
# here rather than per-crate for the same reason as minicbor: what a manifest
# means must not vary by which crate read it.
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# The module cross-check reads a .wasm's imports, exports and custom sections
# (ABI-SPEC §4). Deliberately none of the optional features:
#
#   `validate`  wasmparser's full validator. Pulls `alloc::sync::Arc`, which does not
#               exist on a target without atomics, so it breaks the ESP32-C3 leg of
#               `just check-nostd` outright. (Measured: 9 `alloc::sync` errors.)
#   `features`  proposal gating. Builds fine on both bare-metal targets, and is still
#               not wanted: it gates section *encodings*, not instructions, so it
#               would give partial MVP checking — which is worse than none, because
#               it invites the belief that the loader validates MVP. Conformance to
#               MVP is enforced where it is complete: engine configuration (ABI §4.3).
wasmparser = { version = "0.255", default-features = false }

# Dev-dependency only. The ★ crates stay no_std, but their *tests* build for the
# host, so a std-using test dependency is fine and `check-nostd` never sees it.
proptest = "1.11"

# Dev-dependency only, and specifically not a runtime one: ABI §11.1 states the
# name and version rules as regexes so that every surface enforces the same rule,
# and `manifest`'s hand-written validators have to be provably equivalent to them.
# The proof needs a regex engine; the leaf runtime does not.
regex = "1.11"

# Dev-dependency only. Validates the published JSON Schemas against the same fixtures the
# Rust parsers accept and reject, so the schema and the types cannot drift apart.
boon = "0.6"

# The service file format (SERVICE-SPEC §1). `parse` and `serde`; deliberately not `display`,
# because SERVICE §2 makes the daemon a reader and never a writer. Pinned here rather than in
# `crates/service` because the Designer's backend and the CLI will read the same files, and
# what a service file *means* must not vary by which crate read it.
#
# It is also why `eio-service` is not a ★ crate: measured on rustc 1.97.1, this fails to
# compile for `riscv32imc-unknown-none-elf` — `alloc::sync` is gated behind
# `target_has_atomic = "ptr"` and rv32imc has no A extension. It builds fine for
# `thumbv7em-none-eabihf`, so the constraint is atomics rather than `std`.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

# Module fixtures are checked in as `.wat` so a reviewer can see what each one is testing,
# and assembled at read time. Version-matched to wasmparser because both come from the
# wasm-tools workspace.
#
# A dev-dependency everywhere but `eio-conformance`, where it is a real one: a conformance
# scenario names its module as a file, and refusing to read a `.wat` there would mean the
# suite could only be written against pre-assembled bytes nobody can review (ABI §13.1).
wat = "1.255"

# ── the daemon's own dependencies (std, never reachable from a ★ crate) ──────
#
# Pinned here rather than in `crates/daemon/Cargo.toml` for one reason: the leaf
# runtime will be a second std binary over the same ★ crates, and the two must not
# drift on the pieces they share the shape of (the tracing field names, the CLI
# conventions). Nothing below may ever appear in `nostd_crates` (justfile).

# The engine. `default-features = false` is doing real work: it compiles out the
# threads, component-model and GC support entirely, which is a stronger statement of
# ABI §1's "core WASM only" than a `Config` toggle — with those features off, the
# corresponding `Config` setters do not exist to be forgotten. The five that stay:
#
#   cranelift  the compiler. Required to compile a `.wasm` at all.
#   runtime    the executor. Required to run one.
#   std        rustix-backed platform layer; the daemon is a std binary (DAEMON §1).
#   anyhow     gives `wasmtime::Error` its `From` conversion into `anyhow::Error`, so
#              every `?` in the daemon works without a hand-written one. It is a
#              conversion and not an alias: `anyhow::Context` does not apply to a
#              wasmtime result, so a wasmtime error is given context by converting it.
#   backtrace  guest backtraces on a trap. A trap is an instance's death (ABI §8) and
#              the log line is all anyone gets, so it should say where.
wasmtime = { version = "47.0", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "anyhow",
    "backtrace",
] }

# One task per block instance (DAEMON §5): `rt` for the per-instance current-thread
# runtime, `sync` for the bounded mailbox that feeds it, `macros` for `#[tokio::main]`.
# Each feature earns its place at the point something needs it, so that a feature nobody
# can name a caller for is a feature to remove.
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "sync",
    "macros",
    # The management API's listener (DAEMON §9). `net` is the socket; `time` is what
    # axum's graceful shutdown waits on.
    "net",
    "time",
    # `run` stops on SIGTERM and SIGINT rather than being killed by them, so that ABI §5.1
    # step 5's `eio_stop` runs on the way out (DAEMON §3).
    "signal",
] }

# Structured logging, with guest `log` calls tagged (service, instance) (DAEMON §11).
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The CLI. Derive rather than the builder so the flags and the struct cannot drift.
clap = { version = "4.6", features = ["derive"] }

# `eio:core` `rand` (ABI §7.0). The host mediates it deliberately — it is the
# determinism/replay lever — so the daemon needs a source, and this is the one
# `rand` itself calls. Nothing more is wanted: blocks get bytes, not distributions.
getrandom = "0.4"

# `wasmtime::Error` is `anyhow::Error` (see above), so the daemon's own errors may as
# well be too rather than converting at every boundary.
anyhow = "1.0"

# ── the block manager's dependencies (DAEMON §4) ─────────────────────────────
#
# The registry client is written here rather than taken from `oci-client`, and the
# measurement is the reason: against the daemon's 118-crate tree, `oci-client` with
# `rustls-tls` adds 107 crates including `aws-lc-sys` and `cmake`, and the daemon
# cross-compiles for arm in a release pipeline (`just release-daemon`) that has no C
# toolchain to build either with. The four below add 35, all pure Rust over `ring`.
# What they buy is four requests and a signature check (§4.1, §4.2) — a small enough
# surface that owning it costs less than the tree does.

# HTTP for the pull. Blocking on purpose: it is called from boot, which is sequential
# and runs before any service does, and a blocking client is one that cannot be
# accidentally awaited on the reactor by the management API later (§4.1).
#
# `default-features = false` drops the cookie jar, gzip, charset transcoding and
# `native-tls`; what is left is `rustls` over `ring`, which is the only reason this
# is 35 crates and not 107.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# Digest verification (§4.1) and the precompiled artifact's key (§4.3). `sha256` and
# nothing else: an OCI digest algorithm this node does not accept is refused, not
# computed.
sha2 = "0.10"

# Cosign signatures are ECDSA P-256 over SHA-256 (§4.2). `pem` reads the SPKI public
# key cosign writes; `ecdsa` verifies. No `arithmetic`-heavy extras and no signing —
# a node verifies, it never signs.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem"] }

# The cosign signature travels as a base64 annotation (§4.2). Standard alphabet, and
# the strict decoder: a signature that round-trips through a lenient decoder is a
# signature two implementations could disagree about.
base64 = "0.22"

# ── the management API's dependencies (DAEMON §9) ────────────────────────────
#
# Measured the same way the block manager's were: 28 crates onto the daemon's
# tree, none of them needing a C toolchain, so the arm release build is unaffected.
# What is bought is not just routing — axum's SSE and WebSocket support is what
# DAEMON §11's taps and log streams will be built on, so the alternative was
# paying this later and writing a router in the meantime.

# The server. `default-features = false` drops multipart, the default tracing
# layer, tokio's `macros` re-export and HTTP/2: the API is JSON over HTTP/1 on
# loopback (§2.1), and h2 is a second protocol to be conformant in for nothing.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "query",
] }

# `/openapi.json`, derived from the handlers and the DTOs rather than written
# beside them (DAEMON §9). The derive is the point: SCOPE §4 makes this document
# an agent's tool surface, so an operation's description is user-facing
# documentation, and documentation that lives anywhere but next to the handler
# is documentation that drifts from it.
utoipa = { version = "5", features = ["axum_extras"] }

# ── the guest's own dependencies (compiled into every block) ─────────────────
#
# Both are the guest's alone: nothing on the host side may reach for either, and
# neither may ever appear in a ★ crate other than `block-sdk`.

# The guest allocator behind `eio_alloc`/`eio_free` (SDK §4, ABI §9.6). It is the
# allocator Rust's own wasm32 `std` uses, so a block gets the same one it would
# have got from `std` — without the `std`.
#
# Selected by TARGET, not by `cfg` at the use site, and that distinction is load-
# bearing: `dlmalloc/global`'s `sys` module has backends for wasm and unix only,
# so on `thumbv7em-none-eabihf` and `riscv32imc-unknown-none-elf` it fails to
# compile outright (measured: `release_global_lock` not found in `crate::sys`).
# A `#[cfg]` on the `use` would not help — cargo would still build the crate.
# `just check-nostd` walks both of those targets, so this gating is what keeps
# `eio-sdk` in that list.
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }

# The `log` facade, so a block author writes `log::info!` and it reaches the host's
# `eio:core` `log` (SDK §2). Facade only: `eio-sdk` installs the backend.
log = { version = "0.4", default-features = false }

# ── the `#[block]` macro's dependencies (build-time only) ────────────────────
#
# A proc-macro crate is compiled for the HOST and run by the compiler, so `std`
# here is not a `no_std` violation — `eio-sdk-macros` is not a ★ crate and never
# reaches a guest. What reaches a guest is the code it emits.
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Dev-dependency only. A macro that must reject bad input needs its *rejections*
# tested, and the rejection is a compile error — so the test is a compile that
# fails with the right message. Nothing else can check that.
trybuild = "1.0"

# Workspace-internal crates are pinned by path; the version keeps `cargo publish`
# honest when these eventually reach crates.io.
eio-abi = { path = "crates/abi", version = "0.1.0" }
eio-conformance = { path = "crates/conformance", version = "0.1.0" }
eio-sdk-macros = { path = "crates/block-sdk-macros", version = "0.1.0" }
eio-expr = { path = "crates/expr", version = "0.1.0" }
eio-host-core = { path = "crates/host-core", version = "0.1.0" }
eio-manifest = { path = "crates/manifest", version = "0.1.0" }
eio-sdk = { path = "crates/block-sdk", version = "0.1.0" }
eio-service = { path = "crates/service", version = "0.1.0" }
eio-signal = { path = "crates/signal", version = "0.1.0" }
eio-test-host = { path = "crates/test-host", version = "0.1.0" }

# Lint levels are shared here; the -D warnings escalation belongs to the `just
# lint` recipe, so a local `cargo build` stays usable while CI stays strict.
# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
# All `unsafe` lives in block-sdk's audited glue, each block carrying a
# `// SAFETY:` comment citing the ABI section that justifies it (SDK-SPEC §4).
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

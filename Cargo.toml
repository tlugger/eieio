[workspace]
# Resolver 3 is the edition-2024 default and is MSRV-aware; a virtual manifest
# must state it explicitly.
resolver = "3"
# Crates are added by their own epics. This list grows; it is never a glob,
# because a glob that matches nothing is a hard error in cargo.
members = [
    "crates/daemon",
    "crates/expr",
    "crates/host-core",
    "crates/manifest",
    "crates/signal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tlugger/eieio"

# Pinned once here, used by every crate that touches the wire format. Two host
# implementations have to agree byte for byte (ABI-SPEC §6.3), so the codec
# version is not a per-crate choice.
#
# `default-features = false` drops `std`; `alloc` is what the ★ crates are
# allowed (CLAUDE.md). The `half` feature stays OFF deliberately: eieio's
# canonical form admits binary64 floats only, so a decoder that could read
# binary16 would accept bytes our encoder can never produce (ABI §6.3).
[workspace.dependencies]
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }

# The manifest is JSON (ABI-SPEC §11) and `manifest` is a ★ crate, so its parser
# has to run with `alloc` and no `std` — including on a target without atomics.
# These two do (DAEMON-SPEC §1 records the choice and the alternatives). Pinned
# here rather than per-crate for the same reason as minicbor: what a manifest
# means must not vary by which crate read it.
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# The module cross-check reads a .wasm's imports, exports and custom sections
# (ABI-SPEC §4). Deliberately none of the optional features:
#
#   `validate`  wasmparser's full validator. Pulls `alloc::sync::Arc`, which does not
#               exist on a target without atomics, so it breaks the ESP32-C3 leg of
#               `just check-nostd` outright. (Measured: 9 `alloc::sync` errors.)
#   `features`  proposal gating. Builds fine on both bare-metal targets, and is still
#               not wanted: it gates section *encodings*, not instructions, so it
#               would give partial MVP checking — which is worse than none, because
#               it invites the belief that the loader validates MVP. Conformance to
#               MVP is enforced where it is complete: engine configuration (ABI §4.3).
wasmparser = { version = "0.255", default-features = false }

# Dev-dependency only. The ★ crates stay no_std, but their *tests* build for the
# host, so a std-using test dependency is fine and `check-nostd` never sees it.
proptest = "1.11"

# Dev-dependency only, and specifically not a runtime one: ABI §11.1 states the
# name and version rules as regexes so that every surface enforces the same rule,
# and `manifest`'s hand-written validators have to be provably equivalent to them.
# The proof needs a regex engine; the leaf runtime does not.
regex = "1.11"

# Dev-dependency only. Validates the published JSON Schemas against the same fixtures the
# Rust parsers accept and reject, so the schema and the types cannot drift apart.
boon = "0.6"

# Dev-dependency only. Module fixtures are checked in as `.wat` so a reviewer can see
# what each one is testing, and assembled at test time. Version-matched to wasmparser
# because both come from the wasm-tools workspace.
wat = "1.255"

# ── the daemon's own dependencies (std, never reachable from a ★ crate) ──────
#
# Pinned here rather than in `crates/daemon/Cargo.toml` for one reason: the leaf
# runtime will be a second std binary over the same ★ crates, and the two must not
# drift on the pieces they share the shape of (the tracing field names, the CLI
# conventions). Nothing below may ever appear in `nostd_crates` (justfile).

# The engine. `default-features = false` is doing real work: it compiles out the
# threads, component-model and GC support entirely, which is a stronger statement of
# ABI §1's "core WASM only" than a `Config` toggle — with those features off, the
# corresponding `Config` setters do not exist to be forgotten. The five that stay:
#
#   cranelift  the compiler. Required to compile a `.wasm` at all.
#   runtime    the executor. Required to run one.
#   std        rustix-backed platform layer; the daemon is a std binary (DAEMON §1).
#   anyhow     gives `wasmtime::Error` its `From` conversion into `anyhow::Error`, so
#              every `?` in the daemon works without a hand-written one. It is a
#              conversion and not an alias: `anyhow::Context` does not apply to a
#              wasmtime result, so a wasmtime error is given context by converting it.
#   backtrace  guest backtraces on a trap. A trap is an instance's death (ABI §8) and
#              the log line is all anyone gets, so it should say where.
wasmtime = { version = "47.0", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "anyhow",
    "backtrace",
] }

# One task per block instance (DAEMON §5): `rt` for the per-instance current-thread
# runtime, `sync` for the bounded mailbox that feeds it, `macros` for `#[tokio::main]`.
# Nothing further: the management API arrives with its own epic, and a feature enabled
# early is a feature nobody remembers to justify.
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "sync",
    "macros",
] }

# Structured logging, with guest `log` calls tagged (service, instance) (DAEMON §11).
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The CLI. Derive rather than the builder so the flags and the struct cannot drift.
clap = { version = "4.6", features = ["derive"] }

# `eio:core` `rand` (ABI §7.0). The host mediates it deliberately — it is the
# determinism/replay lever — so the daemon needs a source, and this is the one
# `rand` itself calls. Nothing more is wanted: blocks get bytes, not distributions.
getrandom = "0.4"

# `wasmtime::Error` is `anyhow::Error` (see above), so the daemon's own errors may as
# well be too rather than converting at every boundary.
anyhow = "1.0"

# Workspace-internal crates are pinned by path; the version keeps `cargo publish`
# honest when these eventually reach crates.io.
eio-expr = { path = "crates/expr", version = "0.1.0" }
eio-host-core = { path = "crates/host-core", version = "0.1.0" }
eio-manifest = { path = "crates/manifest", version = "0.1.0" }
eio-signal = { path = "crates/signal", version = "0.1.0" }

# Lint levels are shared here; the -D warnings escalation belongs to the `just
# lint` recipe, so a local `cargo build` stays usable while CI stays strict.
# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
# All `unsafe` lives in block-sdk's audited glue, each block carrying a
# `// SAFETY:` comment citing the ABI section that justifies it (SDK-SPEC §4).
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

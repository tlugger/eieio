[toolchain]
# Pinned to an exact release, not the rolling `stable` channel: clippy and
# rustfmt change behaviour between releases, and every host implementation has
# to agree byte for byte. Bumping this is a deliberate, reviewable commit.
channel = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
    # Blocks are core WASM modules (ABI-SPEC §1).
    "wasm32-unknown-unknown",
    # The two bare-metal targets `just check-nostd` proves the ★ crates against:
    # Cortex-M4F, and the ESP32-C3/C6 class RISC-V that has no atomics. See the
    # comment block in the justfile for why it is both and not one.
    "thumbv7em-none-eabihf",
    "riscv32imc-unknown-none-elf",
]

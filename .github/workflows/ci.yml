# The gate, in CI (SCOPE §7.2).
#
# This workflow runs `just ci` and nothing else substantive. That is deliberate and
# load-bearing: the justfile is the single command surface, so a contributor's local run
# and this one are the same run. Any test, lint or build logic added here would be logic
# that cannot be reproduced locally — if a gate belongs in CI, it belongs in `just ci`.
#
# The setup steps are therefore the only thing to review, and each pins what it installs:
#
#   - The Rust toolchain comes from `rust-toolchain.toml` — channel, profile, components
#     and all three targets. There is no toolchain action, because naming the version in a
#     workflow as well is exactly the drift that file exists to prevent.
#   - `just` comes from its own release, checked against a recorded SHA256.
#   - Both actions are pinned to a commit, not a tag. A tag can move.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On demand, because a push is otherwise the only way to ask. During the Actions
  # outage of 2026-08-06 two pushes to main produced no runs at all and a third sat
  # queued for a day, which left `main` unverified with nothing to do about it but
  # commit something. `gh workflow run ci.yml` is that missing button.
  workflow_dispatch:
  # Callable, so a release pipeline can make the gate a prerequisite job (SCOPE §7.2)
  # by *reusing* it rather than restating it. A release that ran a different gate from
  # the one `main` runs would be exactly the drift this file exists to prevent.
  workflow_call:

# A newer push to the same ref supersedes an in-flight run; the older answer is about code
# nobody is looking at any more.
# `github.workflow` is in the key so a release's reused CI run does not cancel the
# push-triggered run for the same commit, and vice versa: they are different questions
# about the same ref and both answers are wanted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reads the repository. Nothing here publishes, comments or tags.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install just
        # Matches the version developers run locally. The checksum is pinned here rather
        # than fetched alongside the tarball: a checksum a release could rewrite proves
        # nothing about that release.
        env:
          JUST_VERSION: 1.50.0
          JUST_SHA256: 27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0
        run: |
          set -euo pipefail
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}"
          echo "${JUST_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" just
          install -m 0755 just /usr/local/bin/just
          rm -f just "$archive"
          just --version

      - name: Install the pinned Rust toolchain
        # `rustup toolchain install` with no arguments installs exactly what
        # rust-toolchain.toml asks for — channel, profile, components, and the two
        # bare-metal targets `just check-nostd` compiles against, which is why that recipe
        # installs nothing itself. A cargo command would trigger the same install
        # implicitly; doing it here makes it a visible, timed step that fails on its own
        # line if the pin is unavailable.
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show

      - name: Cache the cargo registry and build artifacts
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cargo.lock fixes the dependency graph and rust-toolchain.toml fixes the
          # compiler; between them they decide whether cached artifacts are usable at all.
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install cosign
        # `cargo eio publish`'s signed round trip is verified against the real binary, not a
        # fixture — the whole point of eieio-8yq.18 was that cosign's actual output differs
        # from what we assumed. So the gate needs it, and the test panics rather than skipping
        # when it is absent (a skip here would be a test that proves nothing while looking
        # green, which is what this repo keeps removing). Pinned by digest like every other
        # action, and by version below so a cosign release cannot change what CI verifies.
        # sigstore/cosign-installer v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Install Node
        # The Designer's SPA half. `just ci` adds its suite only where npm exists and says so
        # when it does not — which keeps the gate runnable on a machine with no JS toolchain,
        # and would quietly mean CI tested none of it. So CI is given one, rather than left in
        # the degraded branch: a skip that looks green is what this repo keeps removing.
        # Pinned by digest like every other action. actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: designer/package-lock.json

      - name: just ci
        run: just ci
